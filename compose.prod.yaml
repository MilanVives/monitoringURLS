services:
  mongodb:
    image: mongo:7
    container_name: monitoring-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=monitoring
    volumes:
      - mongodb_data:/data/db
    networks:
      - monitoring-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping').ok", "--quiet", "--host", "localhost", "--port", "27017"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  monitor:
    image: ghcr.io/milanvives/monitoringurls:latest
    container_name: url-monitor
    depends_on:
      mongodb:
        condition: service_started
    ports:
      - "3000:3000"
    volumes:
      - ./public:/usr/src/app/public
      - ./img:/usr/src/app/img
      - ./uploads:/usr/src/app/uploads
    restart: unless-stopped
    networks:
      - monitoring-network
    environment:
      - NODE_ENV=production
      - CHECK_INTERVAL=300000
      - MONGODB_URI=mongodb://mongodb:27017/monitoring
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - SESSION_SECRET=${SESSION_SECRET:-change-this-secret-in-production}
      - OWNER_EMAIL=${OWNER_EMAIL:-milan.dima@vives.be}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/urls"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: monitoring-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - monitor
    networks:
      - monitoring-network

networks:
  monitoring-network:
    driver: bridge

volumes:
  mongodb_data:
